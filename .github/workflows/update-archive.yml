name: Update Course Archive (Dart)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Get dependencies
        run: dart pub add http  # Hurtig måde at få http pakken uden en pubspec.yaml

      - name: Run Dart script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_ORG: "TalentCampDK"
        run: dart scripts/update_archive.dart

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profile/README.md
          git commit -m "Auto-update: README opdateret via Dart script" || exit 0
          git push